name: OficioRD local Cloudflare D1 integration

on:
  pull_request:
    paths:
      - 'functions/api/health.js'
      - 'functions/api/contact-requests.js'
      - 'functions/_lib/atomic-login.js'
      - 'migrations/**'
      - 'scripts/check-local-d1.mjs'
      - '.github/workflows/check-local-d1.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/health.js'
      - 'functions/api/contact-requests.js'
      - 'functions/_lib/atomic-login.js'
      - 'migrations/**'
      - 'scripts/check-local-d1.mjs'
      - '.github/workflows/check-local-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Avoid any accidental Cloudflare remote access. Local Miniflare only.
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral local Cloudflare emulator
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false miniflare@4
      - name: Run local workerd/D1 integration
        run: node scripts/check-local-d1.mjs
