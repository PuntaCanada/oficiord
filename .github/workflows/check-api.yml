name: Check OficioRD public API

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-api.yml'
      - 'functions/**'
      - 'migrations/**'

jobs:
  check-public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Pages public API and D1 binding
        shell: bash
        run: |
          set -euo pipefail
          URL="https://oficiord.pages.dev/api/health"
          for attempt in 1 2 3 4 5; do
            code=$(curl --max-time 20 --silent --show-error --location --output /tmp/api.json --write-out '%{http_code}' "$URL") || code=000
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              python3 -c 'import json; d=json.load(open("/tmp/api.json", encoding="utf-8")); assert d.get("ok") is True and d.get("database")=="connected", "D1 not ready"; print("PASS: D1 binding and query working")'
              echo "Checking safe public configuration and closed submission gate"
              curl --fail --show-error --silent --location --max-time 20 "https://oficiord.pages.dev/api/config" --output /tmp/config.json
              python3 -c 'import json; d=json.load(open("/tmp/config.json",encoding="utf-8")); assert d.get("submissionsEnabled") is False, "Submissions unexpectedly enabled"; assert "TURNSTILE_SECRET" not in str(d) and "secret" not in str(d).lower(), "Secret field leaked"; assert d.get("turnstileConfigured") is True, "Turnstile variables missing"; print("PASS: Turnstile configured; submissions remain disabled")'
              echo "Checking anonymous moderation request never exposes listings"
              admin_code=$(curl --silent --show-error --output /tmp/admin.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/admin/submissions")
              echo "Admin unauthenticated HTTP $admin_code"
              test "$admin_code" = "401"
              echo "Checking that an unauthenticated write is blocked"
              post_code=$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/post.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/submissions")
              echo "Public submission HTTP $post_code"
              test "$post_code" = "503"
              python3 -c 'import json; d=json.load(open("/tmp/post.json",encoding="utf-8")); assert d.get("error")=="SUBMISSIONS_NOT_ENABLED", "Expected closed gate"; print("PASS: no public submissions accepted")'
              echo "Checking public moderation page is deployed"
              html_code=$(curl --silent --show-error --location --output /tmp/admin.html --write-out '%{http_code}' "https://oficiord.pages.dev/admin/")
              echo "Moderation HTML HTTP $html_code"
              test "$html_code" = "200"
              grep -q 'OficioRD · Moderación' /tmp/admin.html
              echo "PASS: all public checks"
              exit 0
            fi
            if [ -f /tmp/api.json ]; then head -c 400 /tmp/api.json; echo; fi
            sleep 10
          done
          echo "::error::OficioRD API is not returning HTTP 200. Verify the D1 binding DB in Cloudflare Pages Production and redeploy."
          exit 1
