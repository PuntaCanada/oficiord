<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OficioRD · Moderation</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173045;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:32px auto;padding:16px}h1{font-size:clamp(23px,4vw,29px);margin:0 0 8px}.panel,.entry{background:white;border:1px solid #dce5ec;border-radius:14px;padding:20px;margin:14px 0}label{display:block;font-weight:650;margin-bottom:8px}input,select{padding:12px;border:1px solid #8da3b3;border-radius:8px;width:100%;font:inherit}input{max-width:495px}button{background:#124d68;color:white;border:0;border-radius:8px;padding:12px 15px;font-weight:700;cursor:pointer;min-height:43px}button.alt{background:#a73535}button.ghost{background:#e7eef3;color:#21394a}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eb9f28;outline-offset:2px}small{color:#586b7b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.note{background:#fff6de;border-left:4px solid #c79122;padding:14px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:12px;align-items:end}.muted{color:#5a6c7a}.top{display:flex;justify-content:space-between;align-items:start;gap:15px;flex-wrap:wrap}.locale{min-width:165px}.locale select{min-width:160px}.tokenbox{margin-bottom:18px}@media(max-width:730px){main{padding:12px}.panel,.entry{padding:16px}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row button{width:100%}}@media(max-width:420px){.row{grid-template-columns:1fr}.locale{width:100%}.locale select{width:100%}}
</style></head><body><main>
<div class="top"><div><h1 data-i18n="heading">🔒 OficioRD · Moderation</h1><p class="muted" data-i18n="subtitle">Privater Prüfbereich für Administratoren.</p></div><div class="locale"><label for="locale" data-i18n="language">Sprache</label><select id="locale" aria-label="Sprache / Language / Idioma"><option value="de">🇩🇪 Deutsch</option><option value="en">🇬🇧 English</option><option value="es">🇩🇴 Español</option></select></div></div>
<div class="note" data-i18n="warning">Prüfe jede Einsendung vor der Freigabe.</div>
<section class="panel"><div class="tokenbox"><label for="token" data-i18n="tokenLabel">Privater Administrationsschlüssel (wird nicht im Browser gespeichert)</label><input id="token" type="password" autocomplete="off" minlength="32" placeholder="Privaten Schlüssel eingeben"><p><small data-i18n="tokenHelp">Der Schlüssel bleibt nur in diesem Tab.</small></p></div>
<div class="row"><div><label for="view" data-i18n="inbox">Posteingang</label><select id="view"><option value="submissions">Anzeigen</option><option value="reports">Meldungen</option><option value="contacts">Kontaktanfragen (manuelle Prüfung)</option></select></div><div><label for="filter" data-i18n="status">Status</label><select id="filter"><option value="pending">Ausstehend</option><option value="approved">Freigegeben</option><option value="rejected">Abgelehnt</option></select></div><button id="load" type="button">Anzeigen laden</button><button id="clear" type="button" class="ghost" data-i18n="logout">Abmelden</button></div>
<p id="message" role="status" aria-live="polite"></p></section><section id="results" aria-live="polite"></section>
</main><script type="module" src="/admin/admin.js"></script></body></html>
