name: Check OficioRD public API

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-api.yml'
      - 'functions/**'
      - 'migrations/**'

jobs:
  check-public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Pages public API and D1 binding
        shell: bash
        run: |
          set -euo pipefail
          URL="https://oficiord.pages.dev/api/health"
          for attempt in 1 2 3 4 5; do
            code=$(curl --max-time 20 --silent --show-error --location --output /tmp/api.json --write-out '%{http_code}' "$URL") || code=000
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              python3 -c 'import json; d=json.load(open("/tmp/api.json", encoding="utf-8")); assert d.get("ok") is True and d.get("database")=="connected", "D1 not ready"; assert d.get("reportingSchema")=="ready", "D1 reporting migration missing"; print("PASS: D1 binding and reports schema ready")'
              echo "Checking safe public configuration and closed submission gate"
              curl --fail --show-error --silent --location --max-time 20 "https://oficiord.pages.dev/api/config" --output /tmp/config.json
              python3 -c 'import json; d=json.load(open("/tmp/config.json",encoding="utf-8")); assert d.get("submissionsEnabled") is False, "Submissions unexpectedly enabled"; assert "TURNSTILE_SECRET" not in str(d) and "secret" not in str(d).lower(), "Secret field leaked"; assert d.get("turnstileConfigured") is True, "Turnstile variables missing"; print("PASS: Turnstile configured; submissions remain disabled")'
              echo "Checking anonymous moderation request never exposes listings"
              admin_code=$(curl --silent --show-error --output /tmp/admin.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/admin/submissions")
              echo "Admin unauthenticated HTTP $admin_code"
              test "$admin_code" = "401"
              echo "Checking that an unauthenticated write is blocked"
              post_code=$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/post.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/submissions")
              echo "Public submission HTTP $post_code"
              test "$post_code" = "503"
              python3 -c 'import json; d=json.load(open("/tmp/post.json",encoding="utf-8")); assert d.get("error")=="SUBMISSIONS_NOT_ENABLED", "Expected closed gate"; print("PASS: no public submissions accepted")'
              echo "Checking report intake remains closed"
              report_code=$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/report.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/reports")
              echo "Public report HTTP $report_code"
              test "$report_code" = "503"
              python3 -c 'import json; d=json.load(open("/tmp/report.json",encoding="utf-8")); assert d.get("error")=="REPORTS_NOT_ENABLED", "Expected closed reporting gate"; print("PASS: public report intake remains closed")'
              echo "Checking anonymous report moderation is inaccessible"
              reports_admin_code=$(curl --silent --show-error --output /tmp/report-admin.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/admin/reports")
              echo "Private reports HTTP $reports_admin_code"
              test "$reports_admin_code" = "401"
              echo "Checking account registration/login remain disabled"
              for endpoint in registration login me; do
                response_code=$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/account.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/account/$endpoint")
                echo "$endpoint POST: $response_code"
                test "$response_code" = "503"
              done
              account_get=$(curl --silent --show-error --output /tmp/account-get.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/account/me")
              echo "Account details GET: $account_get"
              test "$account_get" = "503"
              python3 -c 'import json; d=json.load(open("/tmp/account-get.json",encoding="utf-8")); assert d.get("error")=="ACCOUNTS_NOT_ENABLED", "Account unexpectedly enabled"; print("PASS: Accounts remain disabled")'
              echo "Checking passwordless logout cannot become active inadvertently"
              logout_code=$(curl --silent --show-error --request POST --header 'content-type: application/json' --data '{}' --output /tmp/logout.json --write-out '%{http_code}' "https://oficiord.pages.dev/api/account/logout")
              echo "Logout HTTP $logout_code"
              test "$logout_code" = "503"
              python3 -c 'import json;d=json.load(open("/tmp/logout.json",encoding="utf-8"));assert d.get("error")=="LOGOUT_NOT_ENABLED"'
              echo "Checking public moderation page is deployed"
              html_code=$(curl --silent --show-error --location --output /tmp/admin.html --write-out '%{http_code}' "https://oficiord.pages.dev/admin/")
              echo "Moderation HTML HTTP $html_code"
              test "$html_code" = "200"
              grep -q 'OficioRD · Moderación' /tmp/admin.html
              echo "PASS: all public checks"
              exit 0
            fi
            if [ -f /tmp/api.json ]; then head -c 400 /tmp/api.json; echo; fi
            sleep 10
          done
          echo "::error::OficioRD API is not returning HTTP 200. Verify the D1 binding DB in Cloudflare Pages Production and redeploy."
          exit 1
